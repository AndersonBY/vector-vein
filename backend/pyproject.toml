[project]
authors = [{name = "MakerBi", email = "biying@vectorvein.com"}]
dependencies = [
  "pywebview>=6.2.1",
  "httpx>=0.28.1",
  "peewee>=4.5.3",
  "pypdf>=6.21.4",
  "mammoth>=1.13.0",
  "openpyxl>=3.1.5",
  "python-pptx>=1.0.2",
  "openai>=3.42.0",
  "python-docx>=1.2.0",
  "pandas",
  "yagmail>=0.16.0",
  "qdrant-client>=1.20.0",
  "markdown2>=2.5.5",
  "tiktoken>=0.14.0",
  "pyinstaller>=6.22.3",
  "readability-lxml>=0.9",
  "markdownify>=1.2.3",
  "yt-dlp",
  "pycryptodome>=4.2.0",
  "pyecharts>=2.1.0",
  "pathspec>=1.1.1",
  "langchain-text-splitters>=1.1.3",
  "sqlparse>=0.6.0",
  "anthropic>=1.17.0",
  "pydantic>=2.14.2",
  "jsonschema>=4.26.0",
  "matplotlib",
  "lxml[html_clean]",
  "PyMuPDF",
  "peewee-migrate",
  "websockets",
  "diskcache>=5.6.3",
  "mss>=10.2.0",
  "Pillow",
  "pyaudio>=0.2.14",
  "pynput>=1.8.2",
  "bilili>=1.4.15",
  "pathvalidate>=3.3.1",
  "docx-ea-font>=0.0.1",
  "celery>=5.6.3",
  "fastapi>=0.162.0",
  "uvicorn>=0.54.0",
  "vv-llm[bedrock,vertex]",
  "sqlalchemy",
  "qtpy>=2.4.3; sys_platform == \"linux\"",
  "PySide6>=6.12.0; sys_platform == \"linux\"",
]
description = ""
license = {text = "CC BY-NC-SA"}
name = "vector-vein"
requires-python = ">=3.10,<3.13"
version = "0.5.3"

[project.optional-dependencies]
mac = ["pyobjc; sys_platform == \"darwin\""]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "pytest>=9.2.0",
    "ty>=0.0.95",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

# Keep the original lint policy stable across Ruff default-rule changes.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
build-debug.cmd = "python build.py -t d"
build-debug.env_file = ".env"
build-front = "python build.py -t f"
build.cmd = "python build.py -t p"
build.env_file = ".env"
dev.cmd = "python main.py"
dev.env_file = ".env"
cli = "python cli.py"
fullstack-dev.cmd = "python run_fullstack_dev.py"
fullstack-dev.env_file = ".env"
test = "pytest tests"
lint = "ruff check ."
typecheck = "ty check --python-version 3.10 ."
